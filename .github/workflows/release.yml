name: Build and Release Windows Installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric release version, for example 1.2.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT_PATH: HostelManagementSystem.csproj
  APP_NAME: HostelManagementSystem

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}' -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version '$version' must use MAJOR.MINOR.PATCH format."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore $env:PROJECT_PATH

      - name: Publish self-contained Windows application
        run: >-
          dotnet publish $env:PROJECT_PATH
          --configuration Release
          --framework net10.0-windows
          --runtime win-x64
          --self-contained true
          --property:Version=${{ steps.version.outputs.version }}
          --property:AssemblyVersion=${{ steps.version.outputs.version }}.0
          --property:FileVersion=${{ steps.version.outputs.version }}.0
          --property:InformationalVersion=${{ steps.version.outputs.version }}
          --property:PublishSingleFile=true
          --property:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAPP_VERSION=${{ steps.version.outputs.version }}" `
            "Installer\HostelManagementSystem.iss"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Hostel Management System v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/HostelManagementSystem-Setup-${{ steps.version.outputs.version }}.exe
